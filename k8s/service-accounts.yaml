# The evaluator's identity for storage's signals tenant (k8s:observability/evaluator).
# It gets no Kubernetes API token: it never talks to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluator
automountServiceAccountToken: false
---
# The trends page's: it reads BigQuery with the reader's key, and talks to nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: page
automountServiceAccountToken: false
