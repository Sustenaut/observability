id: plugin_errors
version: 1
severity: warning
summary: More than 5% of an app's calls to a plugin failed over the last 30 minutes, out of at least 20.
lookback_minutes: 30
query: |
  SELECT
    CONCAT(project, '/', app, '/', plugin) AS subject,
    project,
    app,
    plugin,
    SUM(calls) AS call_count,
    SUM(errors) AS error_count,
    SUM(refused) AS refused_count,
    SUM(unavailable) AS unavailable_count
  FROM {{fact:call_rollups}}
  WHERE scope = 'plugin'
  GROUP BY project, app, plugin
  HAVING SUM(calls) >= 20 AND SUM(errors) > 0.05 * SUM(calls)
