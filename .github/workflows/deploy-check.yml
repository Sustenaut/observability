# Seeded by pubkit 0.31.2: this repository's own. Every 30 minutes, the deploy walk, read-only.
name: deploy-check
on: { schedule: [{ cron: '*/30 * * * *' }], workflow_dispatch: {} }
permissions: { actions: read, contents: read, id-token: write }
jobs:
  check:
    uses: Sustenaut/pubkit/.github/workflows/deploy-check.yml@abe660c67ce23d32c5ed25b5c2424a98dac92646 # v0.31.2
    # The journal goes to storage's plane tenant. The zone is shared-infra's, which is
    # private, so the job can't check it out: dns.site stays unknown there.
    with: { journal: 'https://storage.sustenaut.eu' }
    secrets: inherit
