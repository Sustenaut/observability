# Builds the evaluator's image once CI passes on a merge to main, and sends k8s/ to
# the shared k3s server over SSH and the tailnet, with pubrules's k8s-deploy.yml
# (pubrules's README, "Deploying a service to k3s"), where the deploy key can only run
# sustenaut-deploy.
#
# What a deployment reads is in repository variables, so nothing here names a
# consumer: OBSERVABILITY_DATASETS, OBSERVABILITY_SENDERS and OBSERVABILITY_THRESHOLDS,
# which pubrules.json declares. Their values are kept in the owner's state repository: a change there
# sets them with `pubfleet variables --apply` and runs this workflow. It deploys only once
# DEPLOY_OBSERVABILITY is "on", which the deploy walk sets once every need before
# it is ready. Without SUSTENAUT_SERVER the image is built and pushed,
# and nothing is deployed.
name: deploy

on:
  # Once CI (main.yml) has passed on a merge to main, never beside it; k8s-deploy's
  # ready job also waits for the integrations check on that commit.
  workflow_run: { workflows: [main], types: [completed], branches: [main] }
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  deploy:
    uses: Sustenaut/pubdeploy/.github/workflows/k8s-deploy.yml@fc34f05c790732a1ea831d896e557e9f816cba50 # v0.5.0
    with:
      image: ghcr.io/sustenaut/observability
      deploys: k8s observability DEPLOY_OBSERVABILITY
      # It starts as its own user, holds its rules and its dependencies (the page's
      # included), and refuses to evaluate without its settings.
      check: |
        docker run --rm "$IMAGE" sh -c 'test "$(id -u)" = 1000 && observability rules | grep -q "^sender_silent"'
        docker run --rm "$IMAGE" python -c 'import fastavro, yaml, integrations.clients.storage, observability.bigquery, observability.page.main'
        test "$(docker run --rm "$IMAGE" observability evaluate >/dev/null 2>&1; echo $?)" = 2
      render: |
        var() { jq -r --arg name "$1" '.[$name] // ""' <<<"$VARS"; }
        kustomize edit add configmap evaluator-settings \
          --from-literal="OBSERVABILITY_DATASETS=$(var OBSERVABILITY_DATASETS)" \
          --from-literal="OBSERVABILITY_SENDERS=$(var OBSERVABILITY_SENDERS)" \
          --from-literal="OBSERVABILITY_THRESHOLDS=$(var OBSERVABILITY_THRESHOLDS)"
    secrets: inherit

  # The uptime probe's Cloud Run job (shared-infra's infra/uptime.tf), off the server:
  # the image just pushed, through the ghcr remote repository, and its settings. It
  # deploys as observability-uptime-deploy through the GitHub pool, which only main
  # may ask, once UPTIME_CLOUD_RUN (terraform output -raw uptime_cloud_run there) and
  # UPTIME_TARGETS are set; the job runs whatever it last got until then. It runs for the
  # commits the deploy built, so never for one whose CI did not pass.
  uptime:
    needs: deploy
    if: >-
      vars.UPTIME_CLOUD_RUN != '' && vars.UPTIME_TARGETS != ''
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: uptime-cloud-run
      cancel-in-progress: false
    env:
      CLOUD_RUN: ${{ vars.UPTIME_CLOUD_RUN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: where the job is
        id: where
        run: |
          for key in project region job image table provider account; do
            value=$(jq -er --arg key "$key" '.[$key] | strings' <<<"$CLOUD_RUN") ||
              { echo "::error::UPTIME_CLOUD_RUN has no $key"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.where.outputs.provider }}
          service_account: ${{ steps.where.outputs.account }}
      - name: the job's image and settings
        env:
          PROJECT: ${{ steps.where.outputs.project }}
          REGION: ${{ steps.where.outputs.region }}
          JOB: ${{ steps.where.outputs.job }}
          IMAGE: ${{ steps.where.outputs.image }}
          TABLE: ${{ steps.where.outputs.table }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          UPTIME_TARGETS: ${{ vars.UPTIME_TARGETS }}
        run: |
          # The settings as a file, since the targets are JSON with commas in it. They
          # are checked as the probe checks them, so a bad list fails here, not every
          # five minutes there.
          UPTIME_TABLE="$TABLE" PYTHONPATH=src python3 -c 'import os; from observability import uptime; uptime.targets(os.environ["UPTIME_TARGETS"]); uptime.table_parts(os.environ["UPTIME_TABLE"])'
          jq -n --arg targets "$UPTIME_TARGETS" --arg table "$TABLE" \
            '{UPTIME_TARGETS: $targets, UPTIME_TABLE: $table}' > "$RUNNER_TEMP/uptime-env.yaml"
          gcloud run jobs update "$JOB" --project "$PROJECT" --region "$REGION" --quiet \
            --image "$IMAGE:$SHA" --command python --args=-m,observability.uptime \
            --env-vars-file "$RUNNER_TEMP/uptime-env.yaml"
