# The uptime probe (src/observability/uptime.py), from outside the server it
# watches: every five minutes, each target in the repository variable
# UPTIME_TARGETS. A target is down after two runs in a row fail; going down
# and recovering are posted to the UPTIME_SLACK_WEBHOOK secret, and a run
# fails while any target is down, so GitHub's failure email is the backup.
# The state between runs is a small file in the Actions cache.
name: uptime

on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, each after the last, so the state passes in order.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    # Nothing to probe until the targets are set.
    if: vars.UPTIME_TARGETS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { persist-credentials: false }
      - name: the last run's state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: uptime-state.json
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: uptime-state-
      - name: probe the targets
        run: PYTHONPATH=src python3 -m observability.uptime
        env:
          UPTIME_TARGETS: ${{ vars.UPTIME_TARGETS }}
          UPTIME_SLACK_WEBHOOK: ${{ secrets.UPTIME_SLACK_WEBHOOK }}
      - name: this run's state
        if: ${{ always() && hashFiles('uptime-state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: uptime-state.json
          key: uptime-state-${{ github.run_id }}-${{ github.run_attempt }}
