id: storage_errors
version: 1
severity: warning
summary: Storage did not answer the ingest pod for a project in its latest cycle.
# storage_unreachable's version 1, a warning now: a single cycle failing is worth
# seeing, and only several in a row are worth waking someone for.
lookback_minutes: 10
query: |
  WITH windows AS (
    SELECT *, ROW_NUMBER() OVER (PARTITION BY project ORDER BY bucket DESC) AS newest
    FROM {{fact:sender_windows}}
    WHERE kind = 'ingest'
  )
  SELECT project AS subject, bucket, problems
  FROM windows
  WHERE newest = 1 AND storage_ok = FALSE
