id: storage_unreachable
version: 1
severity: critical
summary: Storage did not answer the ingest pod in its latest cycle.
lookback_minutes: 10
query: |
  WITH windows AS (
    SELECT *, ROW_NUMBER() OVER (PARTITION BY project ORDER BY bucket DESC) AS newest
    FROM {{fact:sender_windows}}
    WHERE kind = 'ingest'
  )
  SELECT project AS subject, bucket, problems
  FROM windows
  WHERE newest = 1 AND storage_ok = FALSE
