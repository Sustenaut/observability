id: sender_silent
version: 2
severity: critical
summary: An always-on sender has sent no report for more than its silent_minutes (10 by default).
# Version 2 made its threshold a param, and its default 10 minutes, not 6.
params:
  silent_minutes: 10
lookback_minutes: 60
query: |
  WITH seen AS (
    SELECT project, sender_prefix, MAX(last_cycle_end) AS last_seen
    FROM {{fact:sender_windows}}
    WHERE kind = 'sender'
    GROUP BY project, sender_prefix
  )
  SELECT
    CONCAT(expected.project, '/', expected.sender_prefix) AS subject,
    expected.project,
    expected.sender_prefix,
    seen.last_seen
  FROM {{always_senders}} AS expected
  LEFT JOIN seen
    ON seen.project = expected.project AND seen.sender_prefix = expected.sender_prefix
  WHERE seen.last_seen IS NULL
    OR seen.last_seen < TIMESTAMP_SUB({{now}}, INTERVAL CAST({{param:silent_minutes}} * 60 AS INT64) SECOND)
