# The evaluator's identity for storage's signals tenant (k8s:observability/evaluator) and,
# through Workload Identity, for Google as observability-reader.
# It gets no Kubernetes API token: it never talks to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluator
automountServiceAccountToken: false
---
# The trends page's: it reads BigQuery as observability-reader, through Workload Identity,
# and talks to nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: page
automountServiceAccountToken: false
